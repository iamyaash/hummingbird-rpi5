# Replaces Hummingbird's 00-base.toml, which sets console=tty1 console=ttyS0,115200n8.
# ttyS0 doesn't exist on the Pi 5: its debug UART is ttyAMA10.
# The last console= entry becomes /dev/console, so HDMI (tty1) shows the interactive output.
kargs = ["rootwait", "console=ttyAMA10,115200", "console=tty1"]
